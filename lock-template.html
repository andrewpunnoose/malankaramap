<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>Private</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:#F8F7F4;color:#374151;font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:24px}
.card{width:100%;max-width:380px;text-align:center}
.mark{width:46px;height:46px;border-radius:50%;border:1px solid #D6D3D1;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;color:#8B7355}
.mark svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#8B7355;font-weight:600;margin-bottom:8px}
h1{font:400 30px/1.15 Marcellus,Georgia,serif;color:#111827;margin:0 0 26px}
form{display:flex;flex-direction:column;gap:12px}
input{width:100%;background:#fff;border:1px solid #E5E7EB;border-radius:999px;padding:13px 20px;font:inherit;text-align:center;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:#7A9E7E;box-shadow:0 0 0 3px rgba(122,158,126,.18)}
button{border:0;border-radius:999px;background:#111827;color:#fff;padding:13px 20px;font:500 14px Inter,system-ui,sans-serif;cursor:pointer;transition:background .15s}
button:hover{background:#000}button:disabled{opacity:.5;cursor:default}
.err{min-height:20px;margin-top:14px;color:#B42318;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <div class="mark"><svg viewBox="0 0 24 24"><rect x="5.5" y="11" width="13" height="9" rx="2"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg></div>
  <div class="eyebrow">Malankara Map</div>
  <h1>Private</h1>
  <form id="f" autocomplete="off">
    <input id="p" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <button id="b" type="submit">Enter</button>
  </form>
  <div class="err" id="e" role="alert"></div>
</div>
<script>
(function () {
  var D = /*__PAYLOAD__*/null;
  function u8(b) { var s = atob(b), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  document.getElementById("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var pw = document.getElementById("p").value, btn = document.getElementById("b"), er = document.getElementById("e");
    if (!pw) return;
    btn.disabled = true; er.textContent = ""; btn.textContent = "Opening…";
    var enc = new TextEncoder(), sub = crypto.subtle;
    sub.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (k) {
      return sub.deriveKey({ name: "PBKDF2", salt: u8(D.s), iterations: D.n, hash: "SHA-256" }, k, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    }).then(function (key) {
      return sub.decrypt({ name: "AES-GCM", iv: u8(D.i) }, key, u8(D.c));
    }).then(function (buf) {
      var html = new TextDecoder().decode(buf);
      document.open(); document.write(html); document.close();
    }).catch(function () {
      er.textContent = "That password isn’t right."; btn.disabled = false; btn.textContent = "Enter";
      document.getElementById("p").select();
    });
  });
})();
</script>
</body>
</html>
