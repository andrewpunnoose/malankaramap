<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:#F8F7F4;color:#374151;font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:24px}
.card{width:100%;max-width:380px;text-align:center}
.mark{width:46px;height:46px;border-radius:50%;border:1px solid #D6D3D1;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;color:#8B7355}
.mark svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#8B7355;font-weight:600;margin-bottom:8px}
h1{font:400 30px/1.15 Marcellus,Georgia,serif;color:#111827;margin:0 0 26px}
form{display:flex;flex-direction:column;gap:12px}
input{width:100%;background:#fff;border:1px solid #E5E7EB;border-radius:999px;padding:13px 20px;font:inherit;text-align:center;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:#7A9E7E;box-shadow:0 0 0 3px rgba(122,158,126,.18)}
button{border:0;border-radius:999px;background:#111827;color:#fff;padding:13px 20px;font:500 14px Inter,system-ui,sans-serif;cursor:pointer;transition:background .15s}
button:hover{background:#000}button:disabled{opacity:.5;cursor:default}
.err{min-height:20px;margin-top:14px;color:#B42318;font-size:13px}
</style>
