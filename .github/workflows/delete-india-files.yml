name: Delete India Files

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete files starting with india
        run: |
          git ls-files -z | grep -z '^india' | xargs -0 -r git rm

      - name: Commit deletions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Delete files starting with india"
          git push
